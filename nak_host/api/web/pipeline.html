<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NebulonAK — Pipelines</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<nav><a href="/api/NebulonAK/dashboard/">Status</a><a href="/api/NebulonAK/dashboard/pipeline">Pipeline</a><a href="/api/NebulonAK/dashboard/builder">Builder</a><a href="/api/NebulonAK/dashboard/settings">Settings</a></nav>
<h1>Pipelines</h1>
<div id="error"></div>
<h2>Definitions</h2>
<div id="location" class="dim"></div>
<table id="defs"><tr><th>Name</th><th>Kind</th><th>Nodes</th><th>Description</th><th>Location</th></tr></table>
<h2>Runs <span id="runsfor" class="dim"></span></h2>
<table id="runs"><tr><th>Stamp</th><th>Status</th><th>Worker</th><th>Summary</th></tr></table>
<script src="/assets/api.js"></script>
<script>
"use strict";
async function load() {
  try {
    banner("");
    const loc = await nakApi.pipelineLocation().catch(() => ({}));
    document.getElementById("location").textContent = loc.directory ? "folder: " + loc.directory : "";
    const defs = await nakApi.listPipelines();
    const dt = document.getElementById("defs");
    dt.querySelectorAll("tr.data").forEach(r => r.remove());
    const rows = (defs.definitions || []);
    let firstSlug = "";
    rows.forEach(d => {
      if (!firstSlug && !d.builtin) firstSlug = d.slug;
      const tr = document.createElement("tr");
      tr.className = "data";
      tr.appendChild(el("td", "mono", d.name || d.slug));
      const kind = d.builtin ? "Built-in (code)" : "Builder JSON";
      tr.appendChild(el("td", null, kind));
      tr.appendChild(el("td", "mono", String(d.nodes != null ? d.nodes : "-")));
      tr.appendChild(el("td", null, (d.description || "").slice(0, 120)));
      const locTd = document.createElement("td");
      locTd.className = "mono dim";
      if (d.builtin) {
        locTd.textContent = "defined in code: nak_host/flow/store.py::builtin_vetting_template — open the code to change it";
      } else {
        const a = document.createElement("a");
        a.href = "/api/NebulonAK/dashboard/builder";
        a.textContent = "pipeline/" + d.slug + "/pipeline.json — open in Builder";
        locTd.appendChild(a);
      }
      tr.appendChild(locTd);
      dt.appendChild(tr);
    });
    const slug = firstSlug || (rows[0] && rows[0].slug) || "";
    document.getElementById("runsfor").textContent = slug ? "— " + slug : "";
    const rt = document.getElementById("runs");
    rt.querySelectorAll("tr.data").forEach(r => r.remove());
    if (slug) {
      const rr = await nakApi.pipelineRuns(slug).catch(() => ({runs: []}));
      (rr.runs || []).forEach(r => {
        const tr = document.createElement("tr");
        tr.className = "data";
        tr.appendChild(el("td", "mono", r.stamp));
        const td = document.createElement("td");
        td.appendChild(pill(r.ok));
        tr.appendChild(td);
        tr.appendChild(el("td", null, r.worker || "-"));
        tr.appendChild(el("td", "mono", (r.summary || "").slice(0, 160)));
        rt.appendChild(tr);
      });
    }
  } catch (e) {
    banner("pipelines failed: " + e.message);
  }
}
load();
</script>
</body>
</html>
