# =====================================================================
# nebulonak.cfg — settings for NebulonAK (agents + harness + pipelines).
# Read by: AK tools/chatagent at startup (AK serves nothing itself).
# How the three configs fit together:
#   1. NebulonDB/nebulondb.cfg — the database (port 6969). AK never talks
#      to it directly, so it is NOT referenced anywhere in this file.
#   2. NebulonMD/nebulonmd.cfg — Mind (port 9696). [nebulonmind] base_url
#      below must match Mind's [server] values; if you move Mind, update BOTH.
#   3. nebulonak.cfg (this file) — AK itself: Mind connection, memory
#      recall, tool/member approvals, harness workspace, multitask board.
# Start order: NebulonDB first, then Mind, then AK.
# Sections below: [nebulonmind] Mind connection | [brain] recall/user |
# [paths] install dir | [policy] approvals + loop cap |
# [harness] workspace/verify/retry | [multitask] huge-project board |
# [approval] single live approval channel (terminal|web|auto).
# Env vars (NAK_*) win over this file for one-off runs.
# =====================================================================

[nebulonmind]
# Base URL for NebulonMind API (must include /api/NebulonMind prefix)
# Default matches NebulonMD server: http://localhost:9696/api/NebulonMind
base_url = http://localhost:9696/api/NebulonMind
# Username that will own all memories / agent calls (must be registered via /user/create_user)
user = nmd_user_01
# Request timeouts (seconds)
timeout = 30
connect_timeout = 5
read_timeout = 30
write_timeout = 60
# Verify SSL (false for localhost http)
verify_ssl = false
# Optional auth token if NebulonMind is protected (NMD_API_AUTH_TOKEN)
auth_token =

[brain]
# How many memories to recall by default
default_top_k = 5
# Max characters for bounded context
default_max_characters = 6000
# Whether brain should auto-ensure user exists on first call
auto_create_user = true
# Persist last used user back to this cfg (set to true to update `user` on ensure)
persist_user = false

[paths]
# Home dir for nak (used to resolve cfg location)
nak_home = /home/sathya/Codebase/NebulonAK

[policy]
# Approvals + autonomy. Everything runs on NebulonMind only — no external provider.
# tool_use: ask | allow_once | allow_always | no
#   ask          prompt on every tool call
#   allow_once   approve once per agent run (covers that task after you see the plan)
#   allow_always never ask
#   no           tools disabled (agents reason via Mind only)
# create_agent: ask | allow_once | allow_always | no
#   ask          confirm every creation (default)
#   allow_once   confirm once per session, then auto-create
#   allow_always auto-create without asking
#   no           never create (proposals only)
# max_turns: cap for the agent tool loop
# Env overrides: NAK_POLICY_TOOL_USE, NAK_POLICY_CREATE_AGENT, NAK_POLICY_MAX_TURNS
tool_use = ask
create_agent = ask
max_turns = 6

[harness]
# Harness runtime knobs. Env wins over these values; these win over built-ins.
# Edit here for persistent settings, or export the env var for one-off runs.
# workspace_dir: base dir for per-task workspaces (default: <repo>/workspace)
#   Env: NAK_WORKSPACE
# verify_commands: override verifier checks — JSON list or ';'-separated
#   commands run with cwd=task workspace (default: compileall + pytest)
#   Env: NAK_VERIFY_COMMANDS
#   e.g. verify_commands = python -m compileall -q .; python -m pytest -q .
# verify_timeout: per-check seconds, 1-300 (default 60)
#   Env: NAK_VERIFY_TIMEOUT
# max_retries: auto-recovery budget per turn, 0-5 (default 2)
#   Env: NAK_MAX_RETRIES
# max_delegation: delegate() nesting cap, 1-5 (default 2)
#   Env: NAK_MAX_DELEGATION
# project_memory: persistent per-session project notes to Mind (true/false,
#   default true). Turn-end one-liners + bounded recall into follow-ups.
#   Env: NAK_PROJECT_MEMORY (0/false/no/off disables)
workspace_dir =
verify_commands =
verify_timeout = 60
max_retries = 2
max_delegation = 2
project_memory = true

[approval]
# Single live approval channel — edit ONLY the one live `channel = ...` line
# below (keep a single live line; comment/remove the rest). policy.py reads
# this; never edit policy.py per deploy.
#   channel = terminal -> LIVE: input() prompts in this terminal (web queue removed)
#   channel = web      -> LIVE: browser Approvals card (terminal prompt removed)
#   channel = auto     -> terminal when stdin is a TTY, else web (default)
# Env NAK_APPROVAL_VIA (web|terminal) wins over this file for one-off runs.
# Timeout for a web approval before it denies: NAK_APPROVAL_TIMEOUT seconds (default 120).
channel = auto
# channel = terminal
# channel = web

[multitask]
# PLACEHOLDER — user multitask for HUGE projects only (default OFF).
# Small tasks skip the board entirely; huge tasks use
# workspace/session_<id>/artifacts/nak_plan.md + Mind project memory.
# enabled: false = single-agent (default) | true = allow up to max_agents
#   Env: NAK_MULTITASK_ENABLED (1/true enables for one run)
# max_agents: parallel cap 1-5 (default 5)
#   Env: NAK_MULTITASK_MAX_AGENTS
# huge_tasks: plan steps >= this counts as huge (default 5, min 2)
#   Env: NAK_MULTITASK_HUGE_TASKS
# huge_files: files touched >= this counts as huge (default 5, min 2)
#   Env: NAK_MULTITASK_HUGE_FILES
# Example (huge Django refactor): enabled = true, max_agents = 5
enabled = false
max_agents = 5
huge_tasks = 5
huge_files = 5
