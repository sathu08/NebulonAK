[nebulonmind]
# Base URL for NebulonMind API (must include /api/NebulonMind prefix)
# Default matches NebulonMD server: http://localhost:9696/api/NebulonMind
base_url = http://localhost:9696/api/NebulonMind
# Username that will own all memories / agent calls (must be registered via /user/create_user)
user = nmd_user_01
# Request timeouts (seconds)
timeout = 30
connect_timeout = 5
read_timeout = 30
write_timeout = 60
# Verify SSL (false for localhost http)
verify_ssl = false
# Optional auth token if NebulonMind is protected (NMD_API_AUTH_TOKEN)
auth_token =

[brain]
# How many memories to recall by default
default_top_k = 5
# Max characters for bounded context
default_max_characters = 6000
# Whether brain should auto-ensure user exists on first call
auto_create_user = true
# Persist last used user back to this cfg (set to true to update `user` on ensure)
persist_user = false

[paths]
# Home dir for nak (used to resolve cfg location)
nak_home = /home/sathya/Codebase/NebulonAK
