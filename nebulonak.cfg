# =====================================================================
# nebulonak.cfg — ALL NebulonAK_1 settings live here (one file).
# Everything connects via nak/utils/settings.py (Settings).
#
# RULE: No LLM settings in this file. No [llm] section, no model,
# no provider, no vendor keys. Every LLM call goes via nak.brain
# -> NebulonMD HTTP API. Configure LLM in NebulonMD's
# nebulonmd.cfg [llm] + .env instead.
#
# Start order: NebulonDB (6969) first, then NebulonMD (9696), then AK_1.
# Relative file/dir paths resolve against THIS file's folder.
# Env overrides (win over this file):
#   NAK_BASE_URL / NAK_USER / NAK_AUTH_TOKEN / NAK_TIMEOUT /
#   NAK_MAX_RETRIES / NAK_RETRY_BACKOFF /
#   NAK_AGENTS_FILE /
#   NAK_WORKER_LANG / NAK_CRAFTS / NAK_CRAFTS_PROMPT /
#   NAK_WORKSPACE / NAK_HARNESS_USER / NAK_REGISTRY / NAK_PERMISSIONS / NAK_HOME /
# =====================================================================

[nebulonmind]
# Base URL for NebulonMD API (must include /api/NebulonMind prefix)
base_url = http://localhost:9696/api/NebulonMind
# Username owning all memories / agent calls (register via /user/create_user)
user = nmd_user_01
# Optional shared-secret auth (empty = disabled, local-dev default).
# Brain sends `Authorization: Bearer <token>`; enforced by Mind only
# if Mind's .env sets NMD_API_AUTH_TOKEN to the SAME value.
auth_token = fg2FJ5GUYExWk9X4UqHpwfQf9tMFJLkRIjUaZIl8QJE
# Request timeout seconds (chat/eval use a higher floor internally)
timeout = 180
# Retry policy for transient Mind failures (timeouts, 429/502/503/504).
# max_retries = extra attempts after the first try (0 = fail immediately).
# retry_backoff = base wait seconds, doubled each attempt. Env wins:
# NAK_MAX_RETRIES / NAK_RETRY_BACKOFF.
max_retries = 2
retry_backoff = 1.0

[worker]
# WHAT IT DOES: holds JSON-defined workers (registry below). Each entry
# stores WHO the worker is (top-level name + inline identity: role,
# personality, tone, formality, humor, values, do_not, language; plus
# top-level memory.enabled) and WHAT kind it is (type) plus what it
# may do (capabilities).
# HOW IT ACTS: call it as a function from your script — there are no
# worker defaults here. The entry's own name/type is truth:
#   from nak.worker import GenericWorker
#   w = GenericWorker("vizhi")   # name = entry in workers.json
#   w.prompt()                  # identity -> prompt block
#   w.chat("hello")             # one Brain call -> NebulonMD answer
# Worker registry (relative to this file)
workers_file = nak/manifests/workers.json
# Optional identity language override (empty = use the JSON value).
# Env NAK_WORKER_LANG wins over this.
language =

# NOTE: no [decision] section by design — decision + policy live ONLY in
# each workers.json entry's decision block (edited in the JSON itself).
# New workers inherit code defaults from nak/utils/settings.py
# default_decision_block(). Serve socket stays env-only:
# NAK_SERVE_HOST / NAK_SERVE_PORT (see nak/api/main.py).

[server]
# Decision endpoint served by nak/api: POST {state, questions} -> {answers}.
# Run it with: NAK_SERVE_HOST=127.0.0.1 NAK_SERVE_PORT=8000 .venv/bin/python nak/api/main.py
# then set endpoint below to that URL (change freely per setup).
# Per-worker workers.json decision.endpoint wins over this section.
# Env wins over this file: NAK_DECISION_ENDPOINT / NAK_DECISION_TIMEOUT /
# NAK_DECISION_AUTH_TOKEN.
endpoint = http://localhost:8000/api/NebulonAgentKit
timeout = 30.0
# Shared secret for the endpoint (empty = disabled, local-dev default).
# Backend sends `Authorization: Bearer <token>`; enforced by nak-serve only
# if NAK_SERVE_API_KEY is set to the SAME value. Prefer env for secrets.
auth_token =

[harness]
# Session workspace root (empty = <project>/workspace; NAK_WORKSPACE wins)
workspace_root =
# Session owner (empty = nebulonmind user; NAK_HARNESS_USER wins)
user =
# Tool registry catalog (relative to this file; NAK_REGISTRY wins)
registry = nak/manifests/tools.json
# Worker <-> harness access boundary: which worker may use which tools
# (relative to this file; NAK_PERMISSIONS wins). Enforced by ToolEngine.
permissions = nak/manifests/permissions.json
# Craft registry: plan/assign/... profiles (relative to this file; NAK_CRAFTS wins)
crafts = nak/manifests/crafts.json
# Craft markdown root: <mode>/craft.md bodies (relative to this file; NAK_CRAFTS_PROMPT wins)
crafts_prompt = nak/harness/craft
